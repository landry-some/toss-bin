[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toss-bin"
version = "0.1.0"
description = "An rm replacement that moves files to the trash and can list and restore them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "landry-some" }]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
toss = "toss_bin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
